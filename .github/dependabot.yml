version: 2
updates:
    - package-ecosystem: "composer"
      versioning-strategy: widen
      directory: "/"
      schedule:
          interval: "daily"
      allow:
          - dependency-type: "direct"
      assignees:
          - "Aerendir"
      reviewers:
          - "Aerendir"
      commit-message:
          # Prefix all commit messages with "npm"
          prefix: "[PHP]"
      labels:
          - "Dependabot"
          - "[Type] Dependencies"
          - "[Lang] PHP"
          - "[Status] Automerge"
      open-pull-requests-limit: 1000
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "daily"
      allow:
          - dependency-type: "direct"
      assignees:
          - "Aerendir"
      reviewers:
          - "Aerendir"
      commit-message:
          # Prefix all commit messages with "npm"
          prefix: "[GitHub Action]"
      labels:
          - "Dependabot"
          - "[Type] Dependencies"
          - "[Lang] GitHub Actions"
          - "[Status] Automerge"
      open-pull-requests-limit: 1000
    # PHP CS Fixer through Bamarni
    - package-ecosystem: "composer"
      versioning-strategy: increase
      directory: "/vendor-bin/phpcs/"
      schedule:
          interval: "daily"
      allow:
          - dependency-type: "direct"
      assignees:
          - "Aerendir"
      reviewers:
          - "Aerendir"
      commit-message:
          # Prefix all commit messages with "npm"
          prefix: "[PHP]"
      labels:
          - "Dependabot"
          - "[Type] Dependencies"
          - "[Lang] PHP"
          - "[Status] Automerge"
      open-pull-requests-limit: 1000
    # PHPUnit through Bamarni
    - package-ecosystem: "composer"
      versioning-strategy: increase
      directory: "/vendor-bin/phpunit/"
      ignore:
          # PHPUnit 12 requires PHP >= 8.3 and PHPUnit 13 requires PHP >= 8.4.1, while this matrix
          # still runs 8.2: neither can be installed on the lowest columns. The highest line that
          # covers the whole matrix is 11.5, whose own floor is 8.2. Widening the requirement into
          # a union of lines is not the answer either — the tests are written against one major
          # only, and PHPUnit 12 already stopped reading metadata from doc-comments. Remove this
          # entry when the matrix floor reaches 8.3, in the same change that raises it and migrates
          # the tests to attributes.
          - dependency-name: "phpunit/phpunit"
            versions: [">=12"]
      schedule:
          interval: "daily"
      allow:
          - dependency-type: "direct"
      assignees:
          - "Aerendir"
      reviewers:
          - "Aerendir"
      commit-message:
          # Prefix all commit messages with "npm"
          prefix: "[PHP]"
      labels:
          - "Dependabot"
          - "[Type] Dependencies"
          - "[Lang] PHP"
          - "[Status] Automerge"
      open-pull-requests-limit: 1000
    # Phan through Bamarni
    - package-ecosystem: "composer"
      versioning-strategy: increase
      directory: "/vendor-bin/phan/"
      schedule:
          interval: "daily"
      allow:
          - dependency-type: "direct"
      assignees:
          - "Aerendir"
      reviewers:
          - "Aerendir"
      commit-message:
          # Prefix all commit messages with "npm"
          prefix: "[PHP]"
      labels:
          - "Dependabot"
          - "[Type] Dependencies"
          - "[Lang] PHP"
          - "[Status] Automerge"
      open-pull-requests-limit: 1000
